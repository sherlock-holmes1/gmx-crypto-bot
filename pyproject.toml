[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmx-crypto-bot"
version = "0.1.0"
description = "Read-only GMX perpetuals recording, replay, and simulation research"
requires-python = ">=3.12"

[project.scripts]
gmx-collect = "gmx_crypto_bot_v2.collector:main"
gmx-replay = "gmx_crypto_bot_v2.replay:main"
gmx-validate = "gmx_crypto_bot_v2.validator:main"
